<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D1B2A">
<title>No signal · ScoutBase Campfire</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  /* Self-contained: this page is shown when nothing else can be fetched. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    background: #0d1b2a;
    color: #f7faf8;
    font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 26rem; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin-top: 22px; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; color: #fff; }
  p { margin-top: 12px; color: rgba(247, 250, 248, 0.72); }
  .actions { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
  a {
    display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px;
    border-radius: 999px; text-decoration: none; font-weight: 600; color: #fff;
    border: 1px solid rgba(247, 250, 248, 0.22);
  }
  a.primary { background: #2e7d32; border-color: #2e7d32; }
  a:focus-visible { outline: 2px solid #7ac46f; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No signal just now</h1>
  <p>This page needs a connection. The book itself is saved on this device, so you can still open it and read.</p>
  <p>Anything you were sending in can be sent once you are back in range.</p>
  <div class="actions">
    <a class="primary" href="/">Open the book</a>
    <a href="">Try again</a>
  </div>
</main>
</body>
</html>
